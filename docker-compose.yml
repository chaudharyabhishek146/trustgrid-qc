# Postgres (+ optional MinIO) for local development.
# The app itself runs on the host:  npm run dev  |  npm run worker
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trustgrid
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  # Only needed for STORAGE_BACKEND=s3. The default "local" backend needs
  # nothing but Postgres, so `docker compose up postgres` is enough to demo.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']
    profiles: ['s3']

  createbucket:
    image: minio/mc:latest
    depends_on: [minio]
    profiles: ['s3']
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/trustgrid-images;
      echo 'bucket ready';
      "

volumes:
  pgdata:
  miniodata:
